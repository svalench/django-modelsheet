name: Documentation
on:
  push:
    branches: [main]
    paths: ['docs/**', 'frontend/**', 'mkdocs.yml', 'requirements-docs.txt', 'scripts/check_docs_locales.py', 'scripts/docs_assets.py', '.github/workflows/docs.yml', '.github/workflows/docs-checks.yml']
  pull_request:
    paths: ['docs/**', 'frontend/**', 'mkdocs.yml', 'requirements-docs.txt', 'scripts/check_docs_locales.py', 'scripts/docs_assets.py', '.github/workflows/docs.yml', '.github/workflows/docs-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    uses: ./.github/workflows/docs-checks.yml
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
