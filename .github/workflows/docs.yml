name: Documentation
on:
  push:
    branches: [main]
    paths: ['docs/**', 'frontend/**', 'mkdocs.yml', 'requirements-docs.txt', 'scripts/check_docs_locales.py', 'scripts/docs_assets.py', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'frontend/**', 'mkdocs.yml', 'requirements-docs.txt', 'scripts/check_docs_locales.py', 'scripts/docs_assets.py', '.github/workflows/docs.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm test && npm run build:demo
        working-directory: frontend
      - run: python scripts/check_docs_locales.py
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
