name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Upload version from pyproject.toml to PyPI (leave off to check the build)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: pypi-publishing
  cancel-in-progress: false

jobs:
  metadata:
    name: Check stable release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Check versions and release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/check_release.py --stable --tag "$RELEASE_TAG"

  validate:
    name: Full release validation
    needs: metadata
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish distributions to PyPI
    needs: [metadata, validate]
    if: >-
      github.repository == 'svalench/django-modelsheet' &&
      (github.event_name == 'release' ||
       (inputs.publish && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/django-modelsheet
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist/
      - name: Publish using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
