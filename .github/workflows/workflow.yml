name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Upload version from pyproject.toml to PyPI (leave off to check the build)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: pypi-publishing
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          from modelsheet import __version__

          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          if version != __version__:
              raise SystemExit('Package and project versions do not match')
          tag = os.environ.get('RELEASE_TAG')
          if tag and tag != f'v{version}':
              raise SystemExit(f'Release tag must be v{version}, got {tag}')
          print(f'Building django-modelsheet {version}')
          PY
      - name: Install Python build and test tools
        run: python -m pip install -e '.[test]' twine
      - name: Test and build frontend
        working-directory: frontend
        run: npm ci && npm test && npm run build
      - name: Check committed frontend assets
        run: git diff --exit-code -- modelsheet/static
      - name: Check Django configuration and backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python -m ruff check .
          python -m pytest -q
      - name: Test browser workflows
        working-directory: frontend
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - name: Build wheel and source archive
        run: python -m build
      - name: Check metadata and install the wheel
        run: python -m twine check dist/* && python scripts/package_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    needs: build
    if: >-
      github.repository == 'svalench/django-modelsheet' &&
      (github.event_name == 'release' ||
       (inputs.publish && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/django-modelsheet
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-distributions
          path: dist/
      - name: Publish using PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
